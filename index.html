// Pip pulling the words he knows, a wagon for every three.
function cargoTrain(x, y, s, words, t = 0) {
  const n = Math.max(1, Math.ceil(words.length / 3));
  for (let i = 0; i < n; i++) {
    const wx = x - 215 * s - i * 170 * s;

    words.slice(i * 3, i * 3 + 3).forEach((w, k) => drawWord(w, wx + (-46 + k * 46) * s, y - 86 * s, 52 * s));

  drawPip(x, y, s, { wheel: t });
}

// ---- Saved progress ----------------------------------------------------------------------
const SAVE_KEY = 'pips-first-words-v1';
let save;
function freshSave() { const words = {}; ALL.forEach(w => words[w] = { met: false, finds: 0, box: 0, due: 0, foundIn: [] }); return { session: 0, words, sets: [], muted: false, at: 0 }; }
function loadGame() {
  save = freshSave();
  if (params.get('fresh') !== '1') try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && s.words) { save = Object.assign(save, s); ALL.forEach(w => { if (!save.words[w]) save.words[w] = freshSave().words[w]; }); } } catch (e) {}
  muted = !!save.muted;
  if (PREVIEW) ALL.forEach(w => Object.assign(save.words[w], { met: true, finds: tune.finds_to_know }));
}
// ?all=1: a grown-up preview with every word known; it never saves, so the child's progress is untouched.
const PREVIEW = params.get('all') === '1';
const NOSAVE = PREVIEW || params.get('fresh') === '1';   // test links never overwrite the child's saved progress
function saveGame() { if (!save || NOSAVE) return; save.muted = muted; try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const known = w => save.words[w].finds >= tune.finds_to_know;
const knownWords = () => ALL.filter(known);
const metWords = () => ALL.filter(w => save.words[w].met);
const setDone = ci => CATS[ci].words.every(known);
const intervals = () => [tune.box1, tune.box2, tune.box3, tune.box4];

// ---- Sessions ---------------------------------------------------------------------------------
let sess = null;
function startSession(ci) {
  save.session++; save.at = ci;
  const s = save.session;
  // the grown-up preview (?all=1) walks through every word card of the station, actions included
  const newWords = PREVIEW ? CATS[ci].words.slice() : CATS[ci].words.filter(w => !save.words[w].met).slice(0, tune.new_per_session);
  let review = ALL.filter(w => save.words[w].met && !known(w) && save.words[w].due <= s);
  if (review.length < tune.review_per_session) review = review.concat(ALL.filter(w => save.words[w].met && !review.includes(w) && save.words[w].due <= s));
  if (review.length < tune.review_per_session) review = review.concat(CATS[ci].words.filter(w => save.words[w].met && !known(w) && !review.includes(w)));
  review = review.filter(w => !newWords.includes(w)).sort((a, b) => (CAT_OF[a] === ci ? 0 : 1) - (CAT_OF[b] === ci ? 0 : 1) || save.words[a].due - save.words[b].due).slice(0, tune.review_per_session);
  const doneBefore = CATS.map((c, i) => setDone(i));
  if (!newWords.length && !review.length) { save.session--; saveGame(); sess = null; startAlbum(ci); say(['You know all of them! Hooray!']); return; }
  sess = { s, ci, newWords, review, words: [...newWords, ...review], page: 0, gains: {}, newlyKnown: [], doneBefore, setNow: ci };
  newWords.forEach(w => { const st = save.words[w]; st.met = true; st.box = 0; st.due = s + tune.box1; });
  saveGame();
  if (newWords.length) startScene(); else startMemory();
}
const unlocked = ci => PREVIEW || ci === 0 || setDone(ci - 1) || CATS[ci].words.some(w => save.words[w].met);
const openCount = () => CATS.filter((c, i) => unlocked(i)).length;
// The map: Pip's railway past every station; a tap sends Pip there, slowly, then the station opens.
const STATIONS = [[150, 610], [340, 430], [570, 600], [790, 420], [1010, 600], [1150, 370], [880, 190]];
let mapS = null;
function startMap() {
  mapS = { t: 0, pos: save.at || 0, drive: null, gate: null }; go('map');
  const n = openCount();
  if (save.opened === undefined) save.opened = n;                     // first run: nothing to celebrate yet
  if (n > save.opened && !PREVIEW) {                                   // a station just opened: the barrier lifts
    mapS.gate = { i: n - 1, t: 0 }; save.opened = n; saveGame();
    celebrate(true); say(['A new station is open!', LINE.set(CATS[n - 1])]);
  }
}
function drawGate(i, open) {
  // a level-crossing barrier beside the track, its striped arm lying across the line; it swings up to open
  const [ax, ay] = STATIONS[i - 1], [bx, by] = STATIONS[i], mx = (ax + bx) / 2, my = (ay + by) / 2;
  const perp = Math.atan2(by - ay, bx - ax) + Math.PI / 2, px = mx - Math.cos(perp) * 62, py = my - Math.sin(perp) * 62;
  const ang = perp - open * Math.PI / 2;
  const lw = LW; LW = 4; rr(px - 7, py - 44, 14, 50, 4, '#6b6f80');
  ctx.save(); ctx.translate(px, py - 34); ctx.rotate(ang);
  rr(-6, -9, 132, 18, 8, '#fff'); for (let k = 0; k < 4; k++) rr(12 + k * 30, -9, 15, 18, 2, '#e5533d');
  ctx.restore(); el(px, py - 34, 11, 11, '#e5533d'); LW = lw;
}
function stationAt(x, y) { return STATIONS.findIndex(([sx, sy]) => Math.hypot(x - sx, y - (sy - 70)) < 85); }
function pipOnMap() {
  if (!mapS.drive) { const [x, y] = STATIONS[mapS.pos]; return { x, y, dir: 1 }; }
  const d = mapS.drive, a = STATIONS[d.path[d.i]], b = STATIONS[d.path[d.i + 1]];
  return { x: lerp(a[0], b[0], d.k), y: lerp(a[1], b[1], d.k), dir: b[0] >= a[0] ? 1 : -1 };
}
// ---- Page fades: every screen change cross-fades slowly ---------------------------------------
let fade = 0;
function go(name) { scene = name; fade = 1; events.push({ scene: name }); }

// ---- Scenes ---------------------------------------------------------------------------------
let scene, state, scn = null, mem = null, fnd = null, alb = null, rew = null, night = null, sto = null;
function reset() { seed = Number(params.get('seed')) || CONFIG.seed; state = { t: 0, score: 0, gained: '' }; }

let sessGreet = false;
function home() { if (speech.ok) try { speechSynthesis.cancel(); } catch (e) {} voiceEl.pause(); startMap(); }
function startScene() { scn = { t: 0, ci: sess.setNow }; go('scene'); say([LINE.set(CATS[scn.ci]), L('Look!')]); }
function startPage(i) { sess.page = i; sess.pageT = 0; sess.act = { n: 0, t: 9, ready: false }; const w = sess.newWords[i]; go('play'); say([...beats(w), actLine(w)]); }
function startMemory() {
  const pairs = knownWords().length >= tune.pairs_more_after ? tune.pairs_more : tune.pairs;
  let words = sess.words.slice(0, pairs);
  for (const w of shuffle(metWords())) { if (words.length >= pairs) break; if (!words.includes(w)) words.push(w); }
  for (const w of ALL) { if (words.length >= pairs) break; if (!words.includes(w)) words.push(w); }
  const cards = shuffle([...words, ...words]).map(w => ({ w, open: false, done: false, flip: 0, fly: 0 }));
  mem = { cards, open: [], t: 0, wait: 0, cols: cards.length / 2, ended: false, endT: 0 };
  go('memory'); say("Let's play memory!");
}
function startFind() {
  const prompts = shuffle(sess.words).slice(0, 6);
  fnd = { prompts, i: -1, t: 0 };
  nextFind();
}
function nextFind() {
  fnd.i++;
  if (fnd.i >= fnd.prompts.length) { celebrate(); startAlbum(); return; }
  const w = fnd.prompts[fnd.i], n = save.words[w].finds >= 1 ? tune.choices_known : tune.choices_new;
  let pool = metWords().filter(x => x !== w);
  const same = shuffle(pool.filter(x => CAT_OF[x] === CAT_OF[w])), other = shuffle(pool.filter(x => CAT_OF[x] !== CAT_OF[w]));
  let others = [...same, ...other]; if (others.length < n - 1) others = others.concat(shuffle(ALL.filter(x => x !== w && !others.includes(x))));
  fnd.cur = { w, choices: shuffle([w, ...others.slice(0, n - 1)]), first: true, wrong: [], solved: false, t: 0, wig: -1 };
  go('find'); say(LINE.where(w));
}
function pickFind(i) {
  const c = fnd.cur; if (c.solved || i < 0 || i >= c.choices.length || c.wrong.includes(i)) return;
  const w = c.choices[i];
  if (w === c.w) {
    c.solved = true; c.t = 0; sfx.chime(); { const pp = choicePos(i, c.choices.length); cheer(pp.x, pp.y - 60); }
    const st = save.words[w];
    if (c.first) {
      const thisSess = sess.gains[w] || 0;
      if (thisSess < tune.finds_per_session && st.finds < tune.finds_to_know) {
        const was = known(w); st.finds++; sess.gains[w] = thisSess + 1; st.foundIn.push(sess.s);
        if (!was && known(w)) sess.newlyKnown.push(w);
      }
      st.box = Math.min(3, st.box + 1); st.due = sess.s + intervals()[st.box];
      say('You found it! Well done!');
    } else say([L('Yes! Well done!'), LINE.word(w)]);
    events.push({ find: w, first: c.first }); saveGame();
  } else {
    c.wrong.push(i); c.wig = 0; sfx.soft();

  rain() { el(-18, -18, 26, 20, '#c9d6e8'); el(14, -24, 28, 24, '#c9d6e8'); el(0, -8, 40, 18, '#c9d6e8');
    for (const [x, y] of [[-24, 22], [0, 30], [24, 20], [-12, 46], [14, 48]]) shape(() => { ctx.moveTo(x, y - 9); ctx.quadraticCurveTo(x + 7, y + 3, x, y + 5); ctx.quadraticCurveTo(x - 7, y + 3, x, y - 9); }, '#5c9dff'); },
  // kindergarten phrases: one small picture each
  'shoes-on'() { sub('foot', -20, -16, 58, -0.2); sub('shoe', 16, 28, 62); ctx.beginPath(); ctx.arc(22, -6, 24, 0.3, -1.6, true); ctx.lineWidth = 5; ctx.strokeStyle = CLOUD ? '#b4c5dc' : '#2f8f8a'; ctx.stroke(); arrowHead(16, -30, Math.PI + 0.4, '#2f8f8a'); },
  'hat-off'() { el(0, 24, 30, 28, SKIN); dot(-10, 20, 3.5, OUT); dot(10, 20, 3.5, OUT); arcLine(0, 30, 9, 0.4, Math.PI - 0.4, 3, OUT); sub('hat', 0, -26, 58, -0.25); line([38, -10, 38, -40], 5, '#2f8f8a'); arrowHead(38, -44, -Math.PI / 2, '#2f8f8a'); },
  park() { ctx.fillStyle = CLOUD ? 'rgba(255,255,255,0.7)' : '#8bd35c'; ctx.fillRect(-48, 30, 96, 18); sub('tree', -24, -4, 62); line([8, 32, 18, -30, 44, -30, 48, 32], 4, '#e5533d'); line([26, -30, 22, 12], 2, OUT); line([38, -30, 40, 12], 2, OUT); rr(18, 10, 26, 6, 2, '#ffd23f'); },
  'wash-hands'() { rr(-40, -44, 40, 12, 4, '#9a9a9a'); rr(-12, -44, 10, 26, 3, '#9a9a9a'); sub('hand', 12, 18, 58, 0.3); for (const [x, y] of [[-6, -8], [-2, 6], [-10, 14]]) el(x, y, 4, 6, '#5c9dff'); el(-30, 28, 14, 8, '#fff'); el(-22, 24, 8, 6, '#fff'); },
  'sit-down'() { sub('chair', 8, 10, 74); line([-36, -44, -36, -6], 5, '#2f8f8a'); arrowHead(-36, -2, Math.PI / 2, '#2f8f8a'); },
  sleep() { sub('bed', 0, 16, 84); sub('moon', 32, -30, 34); },
});
function cardPos(i) {
  const n = mem.cards.length, cols = n / 2, w = cols > 3 ? 200 : 230, h = w, gap = 24;
  const col = i % cols, row = Math.floor(i / cols), total = cols * w + (cols - 1) * gap;
  return { x: 640 - total / 2 + w / 2 + col * (w + gap), y: 150 + row * (h + gap), w, h };
}
function choicePos(i, n) { const gap = n === 2 ? 420 : 350; return { x: 640 + (i - (n - 1) / 2) * gap, y: 360 }; }
const STICK = [{ x: 270, y: 230 }, { x: 520, y: 230 }, { x: 760, y: 230 }, { x: 1010, y: 230 }, { x: 395, y: 435 }, { x: 885, y: 435 }];
const stickerPos = k => STICK[k];

// ---- Input: taps and swipes -----------------------------------------------------------------
let swiped = null;

// ---- Loop -------------------------------------------------------------------------------------
function step() {
  swiped = pendingSwipe; pendingSwipe = null;
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if ((pressed('KeyP')) && scene !== 'pause' && scene !== 'title') { pausedFrom = scene; scene = 'pause'; hit.clear(); }
  scenes[scene].update(STEP); hit.clear(); taps.length = 0; swiped = null;
  fade = Math.max(0, fade - STEP / tune.page_fade);
}

let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
let fwLast = null;
function fwDt() { const n = clock.now(), d = fwLast === null ? 0 : Math.min(0.1, n - fwLast); fwLast = n; return d; }
function drawFrame() {
  ctx.save(); scenes[scene].draw(); ctx.restore();
  if (fade > 0) { ctx.fillStyle = `rgba(255,248,238,${fade * 0.95})`; ctx.fillRect(0, 0, W, H); }
  drawFireworks(fwDt());
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset(); loadGame();
const START = params.get('scene') || 'title'; scene = START;
if (['scene', 'play', 'memory', 'find', 'night'].includes(START)) {
  startSession(Number(params.get('set')) || 0);
  if (START === 'play') { startPage(Number(params.get('page')) || 0); if (params.get('act')) Object.assign(sess.act, { n: Number(params.get('act')), t: Number(params.get('at') || 2), ready: true, can: true }); } else if (START === 'memory') startMemory(); else if (START === 'find') startFind(); else if (START === 'night') startNight();
}
if (START === 'album') {   // test pages: ?set=N, &full=1 for a complete page
  const ci = Number(params.get('set')) || 0, ws = CATS[ci].words;
  if (params.get('full') === '1') ws.forEach(w => Object.assign(save.words[w], { met: true, finds: 3 }));
  else { Object.assign(save.words[ws[0]], { met: true, finds: 1 }); Object.assign(save.words[ws[1]], { met: true, finds: 3 }); Object.assign(save.words[ws[2]], { met: true, finds: 2 }); save.words[ws[3]].met = true; }
  startAlbum(ci);
}
if (PREVIEW && START === 'title') startMap();
if (START === 'map') { startMap(); if (params.get('gate')) mapS.gate = { i: 1, t: Number(params.get('gate')) }; }
if (START === 'story') { startStory(Number(params.get('set')) || 0, 'album'); if (params.get('page')) storyPage(Number(params.get('page'))); if (params.get('still') === '1') sto.pageT = 3; }
if (scene === 'reward') rew = { ci: Number(params.get('set')) || 0, t: 3 };
fade = 0; last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
